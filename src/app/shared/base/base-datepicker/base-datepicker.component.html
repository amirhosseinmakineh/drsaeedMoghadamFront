<section
  class="base-datepicker"
  [class.compact]="compact"
  [class.calendar-open]="calendarOpen"
  [attr.dir]="language === 'fa' ? 'rtl' : 'ltr'"
>
  <button
    *ngIf="compact"
    class="compact-trigger"
    type="button"
    [attr.aria-expanded]="calendarOpen"
    (click)="toggleCalendar()"
  >
    <span>{{ labelText }}</span>
    <strong>{{ selectedDate ? selectedDateLabel : "انتخاب تاریخ" }}</strong>
    <b aria-hidden="true">⌄</b>
  </button>

  <div class="calendar-content">
  <header>
    <div>
      <span>{{ labelText }}</span>
      <strong>{{ monthLabel }}</strong>
    </div>
    <div
      class="month-nav"
      [attr.aria-label]="
        language === 'fa' ? 'تغییر ماه تقویم' : 'Change calendar month'
      "
    >
      <button
        type="button"
        (click)="moveMonth(-1)"
        [disabled]="!canMovePrevious"
      >
        {{ language === "fa" ? "ماه قبل" : "Prev" }}
      </button>
      <button
        type="button"
        (click)="moveMonth(1)"
        [disabled]="!canMoveNext"
      >
        {{ language === "fa" ? "ماه بعد" : "Next" }}
      </button>
    </div>
  </header>

  <div *ngIf="monthYearSelection" class="calendar-period">
    <label><span>{{ language === 'fa' ? 'ماه' : 'Month' }}</span>
      <select [value]="activeMonth" (change)="changeCalendarPeriod(activeYear, +$any($event.target).value)">
        <option *ngFor="let month of calendarMonths; let i = index" [value]="i + 1">{{ month }}</option>
      </select>
    </label>
    <label><span>{{ language === 'fa' ? 'سال' : 'Year' }}</span>
      <select [value]="activeYear" (change)="changeCalendarPeriod(+$any($event.target).value, activeMonth)">
        <option *ngFor="let year of calendarYears" [value]="year">{{ year.toLocaleString(language === 'fa' ? 'fa-IR' : 'en-US', {useGrouping: false}) }}</option>
      </select>
    </label>
  </div>

  <div class="week-row" aria-hidden="true">
    <span *ngFor="let day of weekDays">{{ day }}</span>
  </div>

  <div class="day-grid">
    <button
      *ngFor="let day of days"
      type="button"
      [disabled]="day.disabled"
      [class.active]="day.iso === dateValue"
      [class.outside]="day.outsideMonth"
      [attr.aria-label]="day.ariaLabel"
      (click)="select(day)"
    >
      <small>{{ day.weekday }}</small>
      <b>{{ day.label }}</b>
    </button>
  </div>

  <p *ngIf="language === 'fa' && selectedDate" class="calendar-note">
    {{ "تاریخ انتخاب‌شده: " + selectedDateLabel }}
  </p>

  <label *ngIf="language !== 'fa'" class="native-date">
    Pick exact date from device calendar
    <input
      type="date"
      [value]="dateValue"
      (change)="select($any($event.target).value)"
    />
  </label>
  </div>
</section>
