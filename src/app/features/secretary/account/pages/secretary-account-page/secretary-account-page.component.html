<main class="account-page" dir="rtl">
  <header><div><p>داشبورد منشی</p><h1>حسابداری</h1></div><a href="/dashboard/secretary">بازگشت به داشبورد</a></header>
  <app-secretary-account-summary [summary]="summary" [loading]="isLoadingSummary" />
  <app-secretary-transaction-form [categories]="categories" [isSubmitting]="isSubmittingTransaction" (transactionSubmitted)="createTransaction($event)" />
  <app-secretary-transaction-filters [categories]="categories" (filtersChanged)="handleFiltersChanged($event)" />
  <app-secretary-transaction-list [items]="transactions" [loading]="isLoadingTransactions" [page]="page" [pageSize]="pageSize" [totalCount]="totalCount" (pageChanged)="handlePageChanged($event)" (detailsRequested)="showDetails($event)" />
</main>
