<app-base-page-shell
  title="حسابداری منشی"
  description="مدیریت ورودی‌ها و خروجی‌های مالی کلینیک"
>
  <app-base-button basePageActions (pressed)="openCreateDrawer()">
    + ثبت تراکنش
  </app-base-button>

  <app-secretary-account-summary
    [summary]="summary"
    [loading]="isLoadingSummary"
  />

  <app-base-section
    title="تراکنش‌های مالی"
    description="جستجو، فیلتر و مرور گردش مالی کلینیک"
  >
    <app-secretary-transaction-filters
      [categories]="categories"
      (filtersChanged)="handleFiltersChanged($event)"
    />
    <app-secretary-transaction-list
      [items]="transactions"
      [loading]="isLoadingTransactions"
      [hasError]="transactionsLoadFailed"
      [page]="page"
      [pageSize]="pageSize"
      [totalCount]="totalCount"
      (pageChanged)="handlePageChanged($event)"
      (detailsRequested)="showDetails($event)"
      (retry)="loadTransactions()"
    />
  </app-base-section>
</app-base-page-shell>

<app-base-drawer
  title="ثبت تراکنش جدید"
  [open]="createDrawerOpen"
  [loading]="isSubmittingTransaction"
  [closeOnBackdrop]="!isSubmittingTransaction"
  (close)="closeCreateDrawer()"
>
  <app-secretary-transaction-form
    [categories]="categories"
    [isSubmitting]="isSubmittingTransaction"
    (transactionSubmitted)="createTransaction($event)"
  />
</app-base-drawer>

<app-base-drawer
  title="جزئیات تراکنش"
  [open]="detailsDrawerOpen"
  [loading]="isLoadingDetails"
  (close)="closeDetailsDrawer()"
>
  <app-secretary-transaction-details
    [transaction]="selectedTransaction"
    [loading]="isLoadingDetails"
  />
</app-base-drawer>
