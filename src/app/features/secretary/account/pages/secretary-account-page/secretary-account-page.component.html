<app-secretary-account-shell>
<app-base-page-shell
  title="حسابداری منشی"
  description="مدیریت ورودی‌ها و خروجی‌های مالی کلینیک"
>
  <div basePageActions class="page-actions">
    <a class="back-button" routerLink="/dashboard/secretary">بازگشت به داشبورد</a>
    <app-base-button (pressed)="openCreateDrawer()">+ ثبت تراکنش</app-base-button>
  </div>

  <nav class="account-sales-links" aria-label="فروش و کیف پول منشی">
    <a routerLink="sales/new"><strong>ثبت فروش</strong><span>ثبت خدمت برای بیمار و ارسال جهت تأیید ادمین</span></a>
    <a routerLink="sales"><strong>فروش‌های من</strong><span>پیگیری وضعیت فروش‌های ثبت‌شده</span></a>
    <a routerLink="wallet"><strong>کیف پول منشی</strong><span>مشاهده موجودی و تاریخچه پاداش‌ها</span></a>
  </nav>

  <a class="category-management-link" routerLink="expense-categories">
    <strong>مدیریت دسته‌بندی‌های هزینه</strong>
    <span>افزودن، ویرایش، مشاهده و غیرفعال‌سازی دسته‌بندی‌ها</span>
  </a>

  <app-secretary-account-summary
    [summary]="summary"
    [loading]="isLoadingSummary"
  />

  <app-base-section
    title="تراکنش‌های مالی"
    description="جستجو، فیلتر و مرور گردش مالی کلینیک"
  >
    <app-secretary-transaction-filters
      [categories]="categories"
      (filtersChanged)="handleFiltersChanged($event)"
    />
    <app-secretary-transaction-list
      [items]="transactions"
      [loading]="isLoadingTransactions"
      [hasError]="transactionsLoadFailed"
      [page]="page"
      [pageSize]="pageSize"
      [totalCount]="totalCount"
      [receiptLoadingId]="receiptLoadingId"
      (pageChanged)="handlePageChanged($event)"
      (detailsRequested)="showDetails($event)"
      (receiptRequested)="issueReceipt($event)"
      (retry)="loadTransactions()"
    />
  </app-base-section>
</app-base-page-shell>
</app-secretary-account-shell>

<app-base-modal
  title="ثبت تراکنش جدید"
  [open]="createDrawerOpen"
  [closeOnBackdrop]="!isSubmittingTransaction"
  (close)="closeCreateDrawer()"
>
  <app-secretary-transaction-form
    [categories]="categories"
    [isSubmitting]="isSubmittingTransaction"
    (transactionSubmitted)="createTransaction($event)"
  />
</app-base-modal>

<app-base-drawer
  title="جزئیات تراکنش"
  [open]="detailsDrawerOpen"
  [loading]="isLoadingDetails"
  (close)="closeDetailsDrawer()"
>
  <app-secretary-transaction-details
    [transaction]="selectedTransaction"
    [loading]="isLoadingDetails"
    [receiptLoading]="receiptLoadingId === selectedTransaction?.id"
    (receiptPreviewRequested)="issueReceipt($event, 'preview')"
    (receiptShareRequested)="issueReceipt($event, 'share')"
    (receiptDownloadRequested)="issueReceipt($event, 'download')"
    (editRequested)="openEdit($event)"
    (deleteRequested)="requestDelete($event)"
  />
</app-base-drawer>

<app-base-modal title="ویرایش تراکنش" [open]="editModalOpen" [closeOnBackdrop]="!isSubmittingTransaction" (close)="closeEdit()">
  <app-secretary-transaction-form
    [categories]="categories"
    [transaction]="selectedTransaction"
    [isSubmitting]="isSubmittingTransaction"
    (transactionSubmitted)="updateTransaction($event)"
  />
</app-base-modal>

<app-base-confirm-dialog
  title="حذف تراکنش"
  [open]="deleteDialogOpen"
  [message]="deleteMessage"
  confirmLabel="حذف تراکنش"
  variant="danger"
  [loading]="isDeletingTransaction"
  (confirm)="deleteTransaction()"
  (cancel)="closeDelete()"
/>
