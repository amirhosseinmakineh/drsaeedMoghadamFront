<section class="dashboard-layout secretary-mode" dir="rtl">
  <header class="dashboard-mobile-header">
    <div class="mobile-header-info">
      <button class="mobile-menu-btn" type="button" (click)="mobileSidebarOpen = true" aria-label="باز کردن منو"><app-fa-icon name="dashboard" /></button>
      <span class="mobile-avatar"><app-fa-icon name="wallet" /></span>
      <div><strong>{{ displayName() }}</strong><small>منشی</small></div>
    </div>
    <button class="mobile-logout-btn" type="button" (click)="logout()"><app-fa-icon name="logout" /><span>خروج</span></button>
  </header>

  @if (mobileSidebarOpen) {
    <button class="mobile-sidebar-backdrop" type="button" aria-label="بستن منو" (click)="mobileSidebarOpen = false"></button>
  }

  <aside class="dashboard-sidebar" [class.mobile-sidebar-open]="mobileSidebarOpen">
    <div class="mobile-sidebar-header"><strong>منوی داشبورد</strong><button class="mobile-sidebar-close-x" type="button" (click)="mobileSidebarOpen = false"><app-fa-icon name="close" /></button></div>
    <a class="dashboard-brand" routerLink="/"><span class="brand-mark"><app-fa-icon name="tooth" /></span><strong>کلینیک دکتر سعید مقدم</strong></a>
    <div class="dashboard-user-card"><span class="avatar"><app-fa-icon name="calendar" /></span><div><small>کاربر وارد شده</small><h1>{{ displayName() }}</h1><b>منشی</b></div></div>
    <nav class="dashboard-nav" aria-label="داشبورد منشی">
      <a routerLink="/dashboard/secretary"><app-fa-icon name="dashboard" /><span>نمای کلی</span></a>
      <a routerLink="/dashboard/secretary" [queryParams]="{ section: 'reservations' }"><app-fa-icon name="calendar" /><span>رزروها</span></a>
      <a routerLink="/dashboard/secretary" [queryParams]="{ section: 'reviews' }"><app-fa-icon name="check" /><span>تایید حضور</span></a>
      <a class="active" routerLink="/secretary/account"><app-fa-icon name="wallet" /><span>حسابداری</span></a>
    </nav>
    <button class="mobile-sidebar-close" type="button" (click)="mobileSidebarOpen = false">بستن منو</button>
    <button class="secondary-btn logout-btn" type="button" (click)="logout()"><app-fa-icon name="logout" /> خروج از حساب کاربری</button>
  </aside>

  <main class="dashboard-content">
    <section class="secretary-shell">
      <header class="dashboard-hero secretary-hero"><span>داشبورد منشی</span><h2>مدیریت حسابداری کلینیک، {{ displayName() }}</h2></header>
      <ng-content />
    </section>
  </main>

  <nav class="mobile-primary-nav" aria-label="دسترسی سریع داشبورد">
    <a routerLink="/dashboard/secretary"><app-fa-icon name="dashboard" /><span>نمای کلی</span></a>
    <a routerLink="/dashboard/secretary" [queryParams]="{ section: 'reservations' }"><app-fa-icon name="calendar" /><span>رزروها</span></a>
    <a routerLink="/dashboard/secretary" [queryParams]="{ section: 'reviews' }"><app-fa-icon name="check" /><span>تایید حضور</span></a>
    <a class="active" routerLink="/secretary/account"><app-fa-icon name="wallet" /><span>حسابداری</span></a>
  </nav>
</section>
