<section class="workspace" dir="rtl">
  <header class="mobile-header">
    <a routerLink="/dashboard/secretary" aria-label="بازگشت به داشبورد">
      <app-fa-icon name="dashboard" />
    </a>
    <div><strong>حسابداری منشی</strong><small>{{ displayName() }}</small></div>
    <button type="button" (click)="logout()"><app-fa-icon name="logout" /></button>
  </header>

  <aside>
    <a class="brand" routerLink="/">
      <span><app-fa-icon name="tooth" /></span>
      <strong>کلینیک دکتر سعید مقدم</strong>
    </a>
    <section class="user-card">
      <span><app-fa-icon name="wallet" /></span>
      <div><small>کاربر واردشده</small><strong>{{ displayName() }}</strong><b>منشی</b></div>
    </section>
    <nav aria-label="منوی حسابداری">
      <a routerLink="/dashboard/secretary"><app-fa-icon name="dashboard" /><span>داشبورد منشی</span></a>
      <a routerLink="/dashboard/secretary" [queryParams]="{ section: 'reservations' }"><app-fa-icon name="calendar" /><span>رزروها</span></a>
      <a routerLink="/secretary/account" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }"><app-fa-icon name="wallet" /><span>حسابداری</span></a>
    </nav>
    <button class="logout" type="button" (click)="logout()"><app-fa-icon name="logout" /> خروج از حساب</button>
  </aside>

  <main>
    <header class="hero"><span>داشبورد منشی</span><h1>مدیریت حسابداری کلینیک</h1></header>
    <ng-content />
  </main>
</section>
