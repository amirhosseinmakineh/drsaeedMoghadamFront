<form class="transaction-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <h2>ثبت تراکنش جدید</h2>
  <div class="fields">
    <label>نوع تراکنش *<select formControlName="type"><option [ngValue]="null">انتخاب کنید</option>@for (option of transactionTypes; track option.value) { <option [ngValue]="option.value">{{ option.label }}</option> }</select>@if (showError('type', 'required')) { <small>نوع تراکنش الزامی است.</small> }</label>
    <label>مبلغ (ریال) *<input type="number" min="1" inputmode="numeric" formControlName="amount">@if (showError('amount', 'required')) { <small>مبلغ الزامی است.</small> }@if (showError('amount', 'min')) { <small>مبلغ باید بیشتر از صفر باشد.</small> }</label>
    <label>تاریخ تراکنش *<input type="date" formControlName="transactionDate">@if (showError('transactionDate', 'required')) { <small>تاریخ تراکنش الزامی است.</small> }</label>
    <label>روش پرداخت *<select formControlName="paymentMethod"><option [ngValue]="null">انتخاب کنید</option>@for (option of paymentMethods; track option.value) { <option [ngValue]="option.value">{{ option.label }}</option> }</select>@if (showError('paymentMethod', 'required')) { <small>روش پرداخت الزامی است.</small> }</label>
    @if (form.controls.type.value === expenseType) { <label>دسته‌بندی هزینه *<select formControlName="expenseCategoryId"><option [ngValue]="null">انتخاب کنید</option>@for (category of categories; track category.id) { <option [ngValue]="category.id">{{ category.title }}</option> }</select>@if (showError('expenseCategoryId', 'required')) { <small>دسته‌بندی هزینه برای ثبت خروجی الزامی است.</small> }</label> }
    <label>عنوان<input formControlName="subject">@if (showError('subject', 'maxlength')) { <small>عنوان نمی‌تواند بیشتر از ۲۰۰ کاراکتر باشد.</small> }</label>
    <label>طرف حساب<input formControlName="counterpartyName"></label>
    <label>شماره پیگیری<input formControlName="trackingNumber"></label>
    <label class="wide">نشانی رسید<input type="url" formControlName="receiptUrl"></label>
    <label class="wide">توضیحات<textarea rows="3" formControlName="description"></textarea>@if (showError('description', 'maxlength')) { <small>توضیحات نمی‌تواند بیشتر از ۱۰۰۰ کاراکتر باشد.</small> }</label>
  </div>
  <button class="submit" type="submit" [disabled]="form.invalid || isSubmitting">{{ isSubmitting ? 'در حال ثبت…' : 'ثبت تراکنش' }}</button>
</form>
