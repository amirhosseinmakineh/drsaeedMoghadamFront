<form class="transaction-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="wide type-field">
    <span>نوع تراکنش *</span>
    <app-base-segmented-control
      label="نوع تراکنش"
      [options]="transactionTypes"
      [value]="form.controls.type.value"
      (valueChange)="setControl('type', $event)"
    />
    <app-base-form-error [message]="error('type')" />
  </div>

  <app-base-number-input
    class="wide"
    inputId="transaction-amount"
    label="مبلغ"
    suffix="تومان"
    [min]="1"
    [value]="form.controls.amount.value"
    [error]="error('amount')"
    (valueChange)="setControl('amount', $event)"
  />

  <app-base-persian-date-picker
    label="تاریخ تراکنش"
    [required]="true"
    [value]="form.controls.transactionDate.value"
    [error]="error('transactionDate')"
    (valueChange)="setControl('transactionDate', $event)"
  />

  <app-base-select-input
    inputId="payment-method"
    label="روش پرداخت *"
    [options]="paymentMethods"
    [value]="form.controls.paymentMethod.value"
    [error]="error('paymentMethod')"
    (valueChange)="setControl('paymentMethod', +$event)"
  />

  @if (form.controls.type.value === expenseType) {
    <app-base-select-input
      inputId="expense-category"
      label="دسته‌بندی هزینه *"
      [options]="categoryOptions"
      [value]="form.controls.expenseCategoryId.value"
      [error]="error('expenseCategoryId')"
      (valueChange)="setControl('expenseCategoryId', +$event)"
    />
  }

  <app-base-text-input
    inputId="transaction-subject"
    label="عنوان"
    [value]="form.controls.subject.value || ''"
    [error]="error('subject')"
    (valueChange)="setControl('subject', $event)"
  />
  <app-base-text-input
    inputId="transaction-counterparty"
    label="طرف حساب"
    [value]="form.controls.counterpartyName.value || ''"
    [error]="error('counterpartyName')"
    (valueChange)="setControl('counterpartyName', $event)"
  />
  <app-base-text-input
    inputId="tracking-number"
    label="شماره پیگیری"
    [value]="form.controls.trackingNumber.value || ''"
    [error]="error('trackingNumber')"
    (valueChange)="setControl('trackingNumber', $event)"
  />
  <app-base-text-input
    class="wide"
    inputId="receipt-url"
    label="نشانی رسید"
    type="url"
    inputMode="url"
    [value]="form.controls.receiptUrl.value || ''"
    [error]="error('receiptUrl')"
    (valueChange)="setControl('receiptUrl', $event)"
  />
  <app-base-textarea-input
    class="wide"
    inputId="transaction-description"
    label="توضیحات"
    [rows]="4"
    [value]="form.controls.description.value || ''"
    [error]="error('description')"
    (valueChange)="setControl('description', $event)"
  />

  <div class="drawer-actions wide">
    <app-base-button
      type="submit"
      [loading]="isSubmitting"
      [disabled]="form.invalid"
    >
      ثبت تراکنش
    </app-base-button>
  </div>
</form>
