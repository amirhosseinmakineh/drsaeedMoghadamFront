<app-base-filter-bar (apply)="apply()" (reset)="clear()" applyLabel="اعمال فیلترها" resetLabel="پاک کردن فیلترها">
  <app-base-search-filter label="جستجو" placeholder="عنوان یا طرف حساب" [value]="search" (valueChange)="setSearch($event)" />
  <app-base-select-filter label="نوع تراکنش" placeholder="همه" [options]="typeOptions" [value]="type" (valueChange)="setType($event)" />
  <app-base-select-filter label="دسته‌بندی هزینه" placeholder="همه" [options]="categoryOptions" [value]="categoryId" (valueChange)="setCategory($event)" />
  <app-base-persian-date-picker label="از تاریخ" [value]="fromDate" (valueChange)="fromDate = $event" />
  <app-base-persian-date-picker label="تا تاریخ" [value]="toDate" (valueChange)="toDate = $event" />
</app-base-filter-bar>
