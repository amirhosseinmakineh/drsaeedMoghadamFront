<form class="filters" [formGroup]="form" aria-label="فیلتر تراکنش‌ها">
  <label>نوع<select formControlName="type"><option [ngValue]="null">همه</option>@for (option of typeOptions; track option.value) { <option [ngValue]="option.value">{{ option.label }}</option> }</select></label>
  <label>از تاریخ<input type="date" formControlName="fromDate"></label>
  <label>تا تاریخ<input type="date" formControlName="toDate"></label>
  <label>دسته‌بندی<select formControlName="expenseCategoryId"><option [ngValue]="null">همه</option>@for (category of categories; track category.id) { <option [ngValue]="category.id">{{ category.title }}</option> }</select></label>
  <label>جستجو<input type="search" formControlName="search" placeholder="عنوان، طرف حساب یا پیگیری"></label>
  <button type="button" (click)="clear()">پاک کردن</button>
</form>
