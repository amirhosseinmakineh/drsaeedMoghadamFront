<section class="summary" aria-label="خلاصه مالی">
  <app-base-stat-card title="کل ورودی" icon="↗" [value]="money(summary?.totalIncome)" [subtitle]="count(summary?.incomeCount)" [loading]="loading" />
  <app-base-stat-card title="کل خروجی" icon="↙" [value]="money(summary?.totalExpense)" [subtitle]="count(summary?.expenseCount)" [loading]="loading" />
  <app-base-stat-card title="مانده حساب" icon="◈" [value]="money(summary?.balance)" subtitle="مانده خالص" [loading]="loading" />
  <app-base-stat-card title="تعداد تراکنش‌ها" icon="≡" [value]="transactionCount" subtitle="در بازه انتخاب‌شده" [loading]="loading" />
</section>
