<section class="summary" aria-label="خلاصه مالی">
  @if (loading) { <p class="status">در حال دریافت خلاصه مالی…</p> }
  @if (!loading && summary) {
    <article><span>کل ورودی</span><strong>{{ summary.totalIncome | number }}</strong><small>{{ summary.incomeCount | number }} تراکنش</small></article>
    <article><span>کل خروجی</span><strong>{{ summary.totalExpense | number }}</strong><small>{{ summary.expenseCount | number }} تراکنش</small></article>
    <article class="balance"><span>مانده حساب</span><strong>{{ summary.balance | number }}</strong><small>ریال</small></article>
  }
</section>
