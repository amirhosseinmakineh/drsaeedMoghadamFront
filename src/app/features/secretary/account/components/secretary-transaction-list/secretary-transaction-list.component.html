@if (loading && items.length === 0) {
  <div class="skeletons">
    <app-base-skeleton height="4rem" />
    <app-base-skeleton height="12rem" />
    <app-base-skeleton height="4rem" />
  </div>
} @else if (hasError) {
  <app-base-error-state
    title="دریافت تراکنش‌ها ناموفق بود"
    description="ارتباط با سرور برقرار نشد. لطفاً دوباره تلاش کنید."
    retryLabel="تلاش مجدد"
    (retry)="retry.emit()"
  />
} @else if (items.length === 0) {
  <app-base-empty-state
    icon="◎"
    title="هنوز تراکنش مالی ثبت نشده است."
    description="برای ثبت اولین ورودی یا خروجی از دکمه ثبت تراکنش بالای صفحه استفاده کنید."
  />
} @else {
  <app-base-data-table
    [columns]="columns"
    [rows]="rows"
    [loading]="loading"
    [rowClickable]="true"
    actionLabel="صدور رسید"
    [actionLoading]="isReceiptLoading"
    (rowClick)="show($event)"
    (actionClick)="receiptRequested.emit($event.source.id)"
  >
    <app-base-table-pagination
      baseTablePagination
      [currentPage]="page"
      [pageSize]="pageSize"
      [totalCount]="totalCount"
      [disabled]="loading"
      (pageChange)="pageChanged.emit($event)"
    />
  </app-base-data-table>
}
