<section class="panel"><h2>معرفی بیمار جدید</h2><p>اطلاعات بیمار را دقیق وارد کنید تا منشی با ایشان تماس بگیرد.</p><form [formGroup]="form" (ngSubmit)="submit()" novalidate><label>نام<input formControlName="firstName" autocomplete="given-name"><small *ngIf="invalid('firstName')">نام باید بین ۲ تا ۱۰۰ کاراکتر باشد.</small></label><label>نام خانوادگی<input formControlName="lastName" autocomplete="family-name"><small *ngIf="invalid('lastName')">نام خانوادگی باید بین ۲ تا ۱۰۰ کاراکتر باشد.</small></label><label>شماره موبایل<input formControlName="phoneNumber" inputmode="numeric" maxlength="11" dir="ltr" placeholder="09123456789"><small *ngIf="invalid('phoneNumber')">شماره موبایل معتبر ۱۱ رقمی وارد کنید.</small></label><label class="wide">توضیحات (اختیاری)<textarea formControlName="description" maxlength="500" rows="3"></textarea><small *ngIf="invalid('description')">حداکثر ۵۰۰ کاراکتر مجاز است.</small></label><button type="submit" [disabled]="saving">{{saving?'در حال ثبت…':'ثبت معرفی بیمار'}}</button></form></section>
