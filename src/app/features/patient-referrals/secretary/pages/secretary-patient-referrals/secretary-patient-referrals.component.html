<div class="feature-page" dir="rtl"><header class="page-header"><div><h1>بیماران معرفی‌شده <span class="new-count" *ngIf="newCount">{{newCount}}</span></h1><p>پیگیری تماس و ثبت رزرو بیماران معرفی‌شده</p></div><nav><a routerLink="/dashboard/secretary">بازگشت به داشبورد</a></nav></header><main><div class="section-title"><div class="filters"><input [(ngModel)]="query.search" placeholder="جست‌وجوی نام یا موبایل" (keyup.enter)="filter()"><select [(ngModel)]="query.status" (change)="filter()"><option [ngValue]="null">همه وضعیت‌ها</option><option *ngFor="let s of statuses" [ngValue]="s.value">{{s.label}}</option></select><select [(ngModel)]="query.pageSize" (change)="filter()"><option [ngValue]="10">۱۰ رکورد</option><option [ngValue]="20">۲۰ رکورد</option></select><button (click)="filter()">اعمال فیلتر</button></div></div><app-loading *ngIf="loading&&!list"/><div class="cards"><app-referral-card *ngFor="let item of list?.items" [referral]="item" [showReferrer]="true"><button class="primary" *ngIf="item.status===S.Submitted" [disabled]="busyId===item.id" (click)="contact(item)">{{busyId===item.id?'در حال ثبت…':'تماس انجام شد'}}</button><button class="primary" *ngIf="item.status===S.Contacted" (click)="openReserve(item)">ثبت رزرو</button></app-referral-card></div><app-empty-state *ngIf="list&&!list.items.length" title="موردی یافت نشد" description="فیلترها را تغییر دهید."/></main></div>
<app-base-dialog [(open)]="dialog" title="ثبت رزرو بیمار معرفی‌شده" confirmText="ثبت رزرو" [confirmDisabled]="busyId!==null" (confirmClick)="reserve()"><div class="dialog-grid"><label>مشاور فعال<select [(ngModel)]="form.consultantProfileId"><option [ngValue]="0">انتخاب کنید</option><option *ngFor="let c of consultants" [ngValue]="c.id">{{c.fullName}}</option></select></label><label>تاریخ و ساعت مراجعه<input type="datetime-local" [(ngModel)]="form.reservationAt"></label><label>شهر بیمار<input [(ngModel)]="form.patientCity"></label><label>منطقه بیمار<input [(ngModel)]="form.patientRegion"></label><div class="wide"><span>خدمات دندانپزشکی</span><div class="checks"><label *ngFor="let s of services"><input type="checkbox" (change)="toggleService(s.v,$any($event.target).checked)">{{s.l}}</label></div></div><label class="wide">توضیحات<textarea maxlength="500" rows="3" [(ngModel)]="form.description"></textarea></label></div></app-base-dialog>
