<div class="feature-page" dir="rtl"><header class="page-header"><div><h1>تأیید معرفی بیماران</h1><p>بررسی رزرو و پرداخت پاداش معرفی</p></div><nav><a routerLink="/dashboard/admin">بازگشت به داشبورد</a></nav></header><main><div class="filters"><input [(ngModel)]="query.search" placeholder="جست‌وجوی نام یا موبایل" (keyup.enter)="filter()"><select [(ngModel)]="query.status" (change)="filter()"><option [ngValue]="null">همه وضعیت‌ها</option><option *ngFor="let s of statuses" [ngValue]="s.value">{{s.label}}</option></select><select [(ngModel)]="query.pageSize" (change)="filter()"><option [ngValue]="10">۱۰ رکورد</option><option [ngValue]="20">۲۰ رکورد</option></select><button (click)="filter()">اعمال فیلتر</button></div><app-loading *ngIf="loading&&!list"/><div class="cards"><app-referral-card *ngFor="let item of list?.items" [referral]="item" [showReferrer]="true"><ng-container *ngIf="item.status===S.ReservedPendingAdminApproval"><button class="primary" (click)="open(item,'approve')">تأیید و پرداخت پاداش</button><button class="danger" (click)="open(item,'reject')">رد معرفی</button></ng-container></app-referral-card></div><app-empty-state *ngIf="list&&!list.items.length" title="موردی برای بررسی وجود ندارد" description="با تغییر فیلتر، سوابق قبلی را ببینید."/></main></div>
<app-base-dialog [open]="dialog!==null" (openChange)="$event||(dialog=null)" [title]="dialog==='approve'?'تأیید معرفی':'رد معرفی'" [confirmText]="dialog==='approve'?'تأیید و پرداخت':'ثبت رد'" [confirmDisabled]="busyId!==null" (confirmClick)="review()"><ng-container *ngIf="selected as item"><p *ngIf="dialog==='approve'">آیا معرفی بیمار «{{name(item)}}» توسط «{{referrer(item)}}» تأیید شود؟</p><p *ngIf="dialog==='approve'">با تأیید، مبلغ 1,000,000 تومان به کیف پول بیمار معرفی‌کننده اضافه خواهد شد.</p><label *ngIf="dialog==='reject'" class="dialog-grid">دلیل رد<textarea [(ngModel)]="reason" maxlength="500" rows="5" placeholder="دلیل رد را بنویسید"></textarea><small>{{reason.length}} / ۵۰۰</small></label></ng-container></app-base-dialog>
