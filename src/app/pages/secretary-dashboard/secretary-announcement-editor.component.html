<div class="announcement-field">
  <label [for]="controlId">اعلام منشی</label>
  <textarea
    [(ngModel)]="announcement"
    [id]="controlId"
    [name]="controlId"
    [readonly]="!canEdit"
    [disabled]="canceled || saving"
    maxlength="1000"
    rows="2"
    placeholder="نتیجه تماس با بیمار را ثبت کنید"
    (ngModelChange)="markDirty()"
  ></textarea>
  <div class="announcement-meta">
    <small>
      {{ announcement.length }} / ۱۰۰۰
      @if (updatedAt) {
        · آخرین تغییر: {{ updatedAt }}
      }
    </small>
    @if (canEdit) {
      <button type="button" [disabled]="canceled || saving" (click)="save()">
        {{ saving ? "در حال ذخیره..." : "ذخیره اعلام" }}
      </button>
    }
  </div>
  @if (canceled) {
    <small class="field-hint">اعلام رزرو لغوشده قابل ویرایش نیست.</small>
  }
</div>
