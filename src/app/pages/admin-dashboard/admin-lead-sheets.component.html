<section class="lead-sheets admin-panel"><header><div><span class="eyebrow">مدیریت لید</span><h2>شیت لید ادمین</h2><p>لیدها پس از ثبت، به‌صورت خودکار وارد چرخه تخصیص سیستم می‌شوند.</p></div></header><div class="sheet-grid"><form (ngSubmit)="createSheet()"><h3>ساخت شیت جدید</h3><label>نام شیت<input name="sheetName" [(ngModel)]="sheetName" placeholder="مثلاً کمپین مهر" required></label><button class="primary-filter" [disabled]="saving">ساخت شیت</button></form><form (ngSubmit)="addLead()"><h3>افزودن لید</h3><label>شناسه شیت<input type="number" name="sheetId" [(ngModel)]="selectedSheetId" required></label><label>شماره تلفن<input name="phone" [(ngModel)]="phoneNumber" inputmode="tel" required></label><div class="two"><label>نام<input name="first" [(ngModel)]="firstName" required></label><label>نام خانوادگی<input name="last" [(ngModel)]="lastName" required></label></div><button class="primary-filter" [disabled]="!selectedSheetId">ثبت لید</button></form></div>@if(createdSheet){<div class="created">شیت فعال: <strong>{{createdSheet.name}}</strong> — شناسه {{createdSheet.id}}</div>}</section>
