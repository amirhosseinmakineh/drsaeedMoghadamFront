name: Frontend build

on:
  push:
    branches: [stage]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:source
      - run: npm run typecheck
      - run: npm run test:consultant
      - run: npx ng build demo --configuration stage
