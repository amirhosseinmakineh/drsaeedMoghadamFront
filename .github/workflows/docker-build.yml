name: Frontend container build

on:
  pull_request:
  push:
    branches: [develop, stage, production]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dental-front:test
          build-args: |
            ANGULAR_CONFIGURATION=${{ github.ref_name == 'stage' && 'stage' || github.ref_name == 'develop' && 'development' || 'production' }}
            WEBPUSH_VAPID_PUBLIC_KEY=${{ vars.WEBPUSH_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
