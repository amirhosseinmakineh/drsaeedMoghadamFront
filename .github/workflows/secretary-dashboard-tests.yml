name: Secretary dashboard tests

on:
  push:
    branches:
      - test/secretary-dashboard-coverage
  pull_request:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check:secretary-template
      - run: npm run check:patient-finance-template
      - run: npm run check:secretary-sales
