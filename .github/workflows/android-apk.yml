name: Android APK

on:
  push:
    branches: [test/android-accounting-apk]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overlay latest stage web source
        run: |
          git fetch origin stage
          git archive origin/stage | tar -x

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install stage dependencies and Capacitor tooling
        run: |
          npm ci
          npm install --no-save @capacitor/core@8.5.1 @capacitor/android@8.5.1 @capacitor/cli@8.5.1

      - name: Build latest stage and sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK archive
        run: unzip -t android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drsaeedmoghadam-accounting-android-stage
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
