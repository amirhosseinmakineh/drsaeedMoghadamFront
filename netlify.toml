[build]
command = "npm run build"
publish = "dist/demo/browser"

[build.environment]
NODE_VERSION = "20"
REQUIRE_WEBPUSH_CONFIG = "true"

[[redirects]]
  from = "/api/*"
  to = "https://api.drsaeedmoghadam.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/hubs/*"
  to = "https://api.drsaeedmoghadam.com/hubs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200